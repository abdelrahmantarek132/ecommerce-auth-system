<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net *.googleapis.com ...">
    <title>Shop - Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="user-info">
            Welcome, <span id="userName">User</span>
            <button id="logoutBtn" class="logout-btn">Logout</button>
        </div>
        <nav>
            <a href="#hero">Home</a>
            <a href="#products">Products</a>
            <a href="#contact">Contact</a>
        </nav>
        <div class="theme-toggle">
            <div class="light-icon" id="lightThemeBtn">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"><path fill="currentColor" d="M8.463 15.538Q7 14.075 7 12t1.463-3.537T12 7t3.538 1.463T17 12t-1.463 3.538T12 17t-3.537-1.463M5 13H1v-2h4zm18 0h-4v-2h4zM11 5V1h2v4zm0 18v-4h2v4zM6.4 7.75L3.875 5.325L5.3 3.85l2.4 2.5zm12.3 12.4l-2.425-2.525L17.6 16.25l2.525 2.425zM16.25 6.4l2.425-2.525L20.15 5.3l-2.5 2.4zM3.85 18.7l2.525-2.425L7.75 17.6l-2.425 2.525z"></path></svg>
            </div>
            <div class="dark-icon" id="darkThemeBtn">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"><path fill="currentColor" d="M12 21q-3.75 0-6.375-2.625T3 12t2.625-6.375T12 3q.35 0 .688.025t.662.075q-1.025.725-1.638 1.888T11.1 7.5q0 2.25 1.575 3.825T16.5 12.9q1.375 0 2.525-.613T20.9 10.65q.05.325.075.662T21 12q0 3.75-2.625 6.375T12 21"></path></svg>
            </div>
        </div>
    </header>

    <section id="hero" class="hero-section">
        <div class="hero-content">
            <h1>Discover Premium Products</h1>
            <p>Explore top-quality items curated just for you.</p>
        </div>
    </section>

    <main class="main-container">
        <div class="search-section">
            <input type="text" id="searchInput" placeholder="Search products by title...">
        </div>

        <section id="products" class="products-grid">
            <p class="loading">Loading products...</p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
