<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <title>Sign up</title>
</head>
<body>
    <section class="container">
        <h1>Sign up</h1>
        <div class="inputs">
            <div class="input__1">
                <label for="name">User Name</label>
                <input type="text" id="name" placeholder="Enter Your Name"  required>
                <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" width="22" height="22" viewBox="0 0 24 24" style="color: rgb(255, 255, 255); opacity: 1; transform: rotate(0deg);"><path fill="currentColor" d="M9.175 10.825Q8 9.65 8 8t1.175-2.825T12 4t2.825 1.175T16 8t-1.175 2.825T12 12t-2.825-1.175M4 20v-2.8q0-.85.438-1.562T5.6 14.55q1.55-.775 3.15-1.162T12 13t3.25.388t3.15 1.162q.725.375 1.163 1.088T20 17.2V20z"></path></svg>
            </div>
            <div class="input__2">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter Your Email" required>
                <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" width="22" height="22" viewBox="0 0 24 24" style="color: rgb(252, 252, 255); opacity: 1; transform: rotate(0deg);"><path fill="currentColor" d="m20 8l-8 5l-8-5V6l8 5l8-5m0-2H4c-1.11 0-2 .89-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2"></path></svg>
            </div>
            <div class="input__3">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter Your Password"  required>
                <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" width="22" height="22" viewBox="0 0 24 24" style="color: rgb(230, 231, 235); opacity: 1; transform: rotate(0deg);"><path fill="currentColor" d="M6 22q-.825 0-1.412-.587T4 20V10q0-.825.588-1.412T6 8h1V6q0-2.075 1.463-3.537T12 1t3.538 1.463T17 6v2h1q.825 0 1.413.588T20 10v10q0 .825-.587 1.413T18 22zm7.413-5.587Q14 15.825 14 15t-.587-1.412T12 13t-1.412.588T10 15t.588 1.413T12 17t1.413-.587M9 8h6V6q0-1.25-.875-2.125T12 3t-2.125.875T9 6z"></path></svg>
            </div>
            <div class="enter">
                 <button id="Rigester">Rigester</button>
            </div>
        </div>
    </section>
    <script src="script.js"></script>
</body>
</html>
